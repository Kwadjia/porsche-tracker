# Cloudflare Pages project config for the cars.arthurnemeth.com dashboard.
# Static build output in dist/, with Functions in ./functions serving /api/*.
name = "porsche-tracker-cars"
pages_build_output_dir = "dist"
compatibility_date = "2024-11-06"
compatibility_flags = ["nodejs_compat"]

# DATABASE_URL is NOT set here (it's a secret). Set it in the Cloudflare dashboard
# (Settings -> Environment variables, Production) or via:
#   wrangler pages secret put DATABASE_URL
# For local `wrangler pages dev`, put it in web/.dev.vars (gitignored).
